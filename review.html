<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>推文每日复习</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #e7e9ea;
      background: #15202b;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(760px, calc(100% - 32px)); margin: 36px auto; }
    header { display: flex; align-items: center; margin-bottom: 20px; }
    .export-bar { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    h1 { margin: 0; font-size: 22px; }
    #viewToggle, .action-btn, .translation-toggle {
      border: 1px solid #38444d;
      border-radius: 8px;
      padding: 8px 12px;
      color: #e7e9ea;
      background: #1c2733;
      font: inherit;
      cursor: pointer;
    }
    #viewToggle:hover, .action-btn:hover, .translation-toggle:hover { border-color: #1d9bf0; color: #1d9bf0; }
    #summary { margin: 0 0 16px; color: #8b98a5; }
    #list { display: grid; gap: 14px; }
    .tweet-card { padding: 18px; border: 1px solid #38444d; border-radius: 14px; background: #192734; }
    .tweet-meta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; color: #8b98a5; font-size: 13px; }
    .tweet-meta strong { color: #e7e9ea; font-size: 14px; }
    .tweet-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .translation { margin-top: 12px; padding: 10px 12px; border-left: 3px solid #1d9bf0; color: #b4c1ce; white-space: pre-wrap; overflow-wrap: anywhere; }
    .translation[hidden] { display: none; }
    .tweet-link { color: #1d9bf0; text-decoration: none; white-space: nowrap; }
    .tweet-link:hover { text-decoration: underline; }

    /* 逐句对照：每句一对（原句 + 译句），译句默认隐藏，可展开比对 */
    .interleave { --xtl-trans-color: rgb(13, 97, 204); }
    @media (prefers-color-scheme: dark) { .interleave { --xtl-trans-color: rgb(108, 178, 238); } }
    .pair {
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: #192734;
    }
    .pair .orig { margin: 0; font-size: 15px; line-height: 20px; overflow-wrap: anywhere; }
    .pair .trans {
      margin: 4px 0 0;
      color: var(--xtl-trans-color);
      font-size: 14px;
      line-height: 18px;
      overflow-wrap: anywhere;
    }
    .translation-toggle { padding: 8px 10px; margin-top: 6px; }

    .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .action-btn.primary { border-color: #1d9bf0; color: #1d9bf0; }
    .export-btn { padding: 6px 12px; font-size: 13px; }
    /* 选中的收藏勾选框：小圆邊 + 显示对号 */
    .export-select {
      margin: 0;
      width: 22px;
      height: 22px;
      flex: none;
      border: 2px solid #38444d;
      border-radius: 5px;
      background: #192734;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .export-select::after {
      content: "✓";
      font-size: 12px;
      line-height: 1;
      color: #1d9bf0;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .export-select:checked { border-color: #1d9bf0; background: #16222f; }
    .export-select:checked::after { opacity: 1; }
    .export-select:hover { border-color: #1d9bf0; }
    .export-select:focus-visible { outline: 2px solid #1d9bf0; outline-offset: 1px; }
    .empty { padding: 36px 18px; text-align: center; color: #8b98a5; border: 1px dashed #38444d; border-radius: 14px; }
    @media (max-width: 520px) {
      main { margin: 20px auto; }
      header { align-items: flex-start; flex-direction: column; }
      .tweet-meta { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 data-i18n="reviewTitle">推文每日复习</h1>
      <div class="export-bar">
        <button id="exportSelectedBtn" class="action-btn export-btn" data-i18n="exportSelected" disabled>导出选中</button>
        <button id="exportAllBtn" class="action-btn export-btn" data-i18n="exportAll">导出全部</button>
        <button id="clearAllBtn" class="action-btn export-btn" data-i18n="clearAll">清空收藏</button>
        <button id="viewToggle" type="button" data-i18n="reviewAll">全部收藏</button>
      </div>
    </header>
    <p id="summary" aria-live="polite"></p>
    <section id="list" aria-live="polite"></section>
  </main>
  <script src="sentence-split.js"></script>
  <script src="saved-tweets.js"></script>
  <script src="review.js"></script>
</body>
</html>
